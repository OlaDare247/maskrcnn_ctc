VERSION: 2
_BASE_: "base_maskrcnn_r50_fpn.yaml"

DATASETS:
  TRAIN: ("sim01_train",)
  TEST: ("sim02_val",)

MODEL:
  WEIGHTS: "detectron2://ImageNetPretrained/MSRA/R-50.pkl"

  ROI_HEADS:
    NUM_CLASSES: 1
    BATCH_SIZE_PER_IMAGE: 512
    SCORE_THRESH_TEST: 0.05

  ANCHOR_GENERATOR:
    SIZES: [[8], [16], [32], [64], [128]]
    ASPECT_RATIOS: [[0.5, 1.0, 2.0]]

  RPN:
    PRE_NMS_TOPK_TRAIN: 6000
    PRE_NMS_TOPK_TEST: 3000
    POST_NMS_TOPK_TRAIN: 3000
    POST_NMS_TOPK_TEST: 1500

  ROI_MASK_HEAD:
    POOLER_RESOLUTION: 56

SOLVER:
  IMS_PER_BATCH: 1
  BASE_LR: 0.000025
  MAX_ITER: 30000
  STEPS: (18000, 24000)
  GAMMA: 0.1
  WARMUP_ITERS: 1000
  CHECKPOINT_PERIOD: 3000

TEST:
  EVAL_PERIOD: 3000

DATALOADER:
  NUM_WORKERS: 4

OUTPUT_DIR: "/home/users/ooluwadare/maskrcnn_ctc/outputs/sim_maskrcnn_v4"